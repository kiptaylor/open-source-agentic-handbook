catalog:
  version: 1.0.0
  status: stable

canonical_registries:
  agents: registries/agents.json
  skills: registries/skills.json
  policies: registries/policies.json
  guides: registries/guides.json
  releases: registries/releases.json
  compatibility: registries/compatibility.json
  requests: registries/requests.json

distribution_buckets:
  core: Required by the selected agent profiles.
  optional: Selected role, workflow, policy, or tool-adapter skills.
  project: Defined and versioned by a downstream repository.

skill_buckets:
  core:
    - scope-and-instruction-handling
    - public-source-boundaries
    - planning-and-termination
    - safe-tool-use
    - evidence-and-validation
    - failure-recovery
    - human-escalation
    - state-and-memory-hygiene
  roles:
    - researcher
    - writer
    - reviewer
    - builder
    - maintainer
  workflows:
    - public-knowledge-transfer
  policies:
    - public-source-publication
  tool_adapters: []

profiles:
  control_plane:
    - orchestrator
    - watchdog
    - context-steward
    - security-governor
    - verifier
  workers:
    - researcher
    - writer
    - builder

orchestration_patterns:
  - direct
  - delegated
  - parallel
  - maker-checker
