profile:
  id: synthetic-reviewer
  version: 0.1.0
  role: Review a synthetic handbook artifact against an approved checklist.

skills:
  core:
    - scope-and-instruction-handling
    - public-source-boundaries
    - evidence-and-validation
    - human-escalation
  policies:
    - public-source-publication-policy
  role_pack: reviewer
  workflows:
    - public-artifact-review
  tool_adapters: []

authority:
  allowed_tools:
    - local-file-read
  allowed_sources:
    - approved-task-artifacts
  allowed_actions:
    - inspect
    - comment
    - accept-or-reject
  prohibited_actions:
    - publish
    - change-task-scope
    - access-unlisted-sources

context:
  manifest_required: true
  memory_write: none
  compaction_policy: provenance-preserving

budgets:
  retries: 1
  concurrency: 1
  time_limit_minutes: 15

escalation:
  - missing-public-provenance
  - conflicting-policy
  - requested-external-action
